# This file was autogenerated by actions.nix. Do not edit it manually.
# To make changes, edit the workflow definition in your flake's actions-nix configuration
# (typically under flake.actions-nix.workflows.".github/workflows/metrics.yml") and run:
#   nix run .#render-workflows
# Or commit to trigger the pre-commit hook if enabled.
jobs:
  metrics-job:
    environment:
      name: profile-readme
    name: Generates assets/github-metrics.svg
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
    - uses: lowlighter/metrics@latest
      with:
        base: header, activity, community, repositories, metadata
        base_hireable: 'yes'
        base_indepth: 'no'
        committer_token: ${{ secrets.GITHUB_TOKEN }}
        config_octicon: 'yes'
        config_timezone: Asia/Kolkata
        config_twemoji: 'yes'
        extras_css: |-
          .calendar.field, .items-wrapper > section:last-of-type { display: none !important; }
          footer { display: none !important; }
          /* The classic template uses the same heart icon for Sponsors and Sponsoring. */
          .field:has(> svg > path[d^="M4.25 2.5c-1.336 0-2.75 1.164-2.75 3"]) { display: none !important; }
        filename: assets/github-metrics.svg
        plugin_achievements: 'yes'
        plugin_achievements_threshold: B
        plugin_followup: 'yes'
        plugin_followup_sections: repositories, user
        plugin_habits: 'no'
        plugin_habits_charts_type: classic
        plugin_habits_days: 14
        plugin_habits_facts: 'yes'
        plugin_habits_from: 200
        plugin_habits_languages_limit: 8
        plugin_habits_languages_threshold: 0%
        plugin_isocalendar: 'no'
        plugin_isocalendar_duration: half-year
        plugin_languages: 'no'
        plugin_languages_analysis_timeout: 15
        plugin_languages_analysis_timeout_repositories: 7.5
        plugin_languages_categories: markup, programming
        plugin_languages_colors: github
        plugin_languages_limit: 20
        plugin_languages_recent_categories: markup, programming
        plugin_languages_recent_days: 14
        plugin_languages_recent_load: 300
        plugin_languages_sections: most-used
        plugin_languages_threshold: 0%
        plugin_lines: 'yes'
        plugin_lines_delay: 30
        plugin_lines_sections: base
        plugin_notable: 'yes'
        plugin_notable_from: all
        plugin_notable_types: commit, pull_request
        plugin_stargazers: 'no'
        plugin_stargazers_charts: 'no'
        plugin_stargazers_charts_type: classic
        plugin_stargazers_days: 14
        plugin_topics: 'yes'
        plugin_topics_limit: 8
        plugin_topics_mode: icons
        plugin_topics_sort: activity
        plugin_traffic: 'yes'
        template: classic
        token: ${{ secrets.PROFILE_README_TOKEN }}
        user: DivitMittal
    timeout-minutes: 30
name: Metrics
'on':
  schedule:
  - cron: 0 * * * *
  workflow_dispatch: {}
